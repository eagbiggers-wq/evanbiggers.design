<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
const portfolioRoute = new URL("portfolio.html", window.location.href);
portfolioRoute.searchParams.set("gallery", "editorial");
window.location.replace(portfolioRoute.href);
</script>
<title>User Interface and Experience Collection | Evan Biggers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e4;--ink:#1a1916;--mute:#706c63;--line:#c8c0af;--pad:clamp(16px,2.5vw,32px);--gap:1px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 "JetBrains Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid currentColor;outline-offset:-4px}
h1,p,figure{margin:0}
.page{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
.grid{display:grid;gap:var(--gap);background:var(--line);border:1px solid var(--line)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cell{min-width:0;background:var(--bg);padding:var(--pad)}
.span-2{grid-column:span 2}
.section{margin-top:var(--pad)}
header.grid{margin-top:var(--pad)}
header .cell{display:flex;align-items:center;padding-block:14px}
nav{display:flex;justify-content:flex-end;gap:24px;width:100%}
nav a:hover,footer a:hover{text-decoration:underline;text-underline-offset:4px}
.back-row{padding:clamp(12px,2vw,24px) 0 0}
.back-button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;transition:background .15s,color .15s}
.back-button:hover{background:var(--ink);color:var(--bg)}
.intro{min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
h1{font-size:clamp(9px,3.4vw,36px);line-height:1.08;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.intro p,figcaption,footer{color:var(--mute)}
.image-grid .cell{display:grid;gap:12px;align-content:start}
.image-grid a.cell{transition:background .15s,color .15s}
.image-grid a.cell:hover,.image-grid a.cell:focus-visible{background:var(--ink);color:var(--bg)}
.image-grid a.cell:hover figcaption,.image-grid a.cell:focus-visible figcaption{color:inherit;opacity:.7}
.image-slot{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}
.image-slot span{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;background:var(--bg);padding:2px 8px;color:var(--mute);font-size:12px}
figcaption,footer{font-size:12px}
footer{display:flex;justify-content:space-between;gap:16px;padding:var(--pad) 0 calc(var(--pad)*1.5)}
@media(max-width:820px){.cols-3{grid-template-columns:repeat(2,1fr)}.span-2{grid-column:span 2}}
@media(max-width:540px){.cols-3{grid-template-columns:1fr}.span-2{grid-column:auto}nav{gap:16px}.intro .cell{padding-inline:8px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<div class="page gallery-page">
  <header class="grid cols-3">
    <div class="cell"><a href="portfolio.html"><strong>Evan Biggers</strong></a></div>
    <div class="cell span-2"><nav aria-label="Primary"><a href="portfolio.html#contact" data-contact-open aria-haspopup="dialog">Contact</a></nav></div>
  </header>
  <div class="back-row"><a class="back-button" href="portfolio.html" aria-label="Back to home" title="Back to home"><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12c0-.55.3-1.05.8-1.34l12.6-7.5c2.18-1.3 4.77.52 4.36 3.03l-1.95 11.63c-.42 2.5-3.45 3.44-5.22 1.65L3.53 13.35A1.9 1.9 0 0 1 3 12Z"/></svg></a></div>
  <main>
    <section class="grid section intro" aria-labelledby="gallery-title">
      <div class="cell"><h1 id="gallery-title">User Interface and Experience Collection</h1></div>
    </section>
    <section class="section" aria-label="User Interface and Experience Collection">
      <div class="image-grid">
        <a class="gallery-item" data-gallery-pages="Smart Campus Artboards/scfinal1.png|Smart Campus Artboards/scfinal2.png|Smart Campus Artboards/scfinal3.png|Smart Campus Artboards/scfinal4.png|Smart Campus Artboards/scfinal5.png|Smart Campus Artboards/scfinal6.png|Smart Campus Artboards/scfinal7.png" href="image-detail.html?collection=editorial&image=01" aria-label="Open Smart Campus: Smart Campus"><div class="gallery-media" style="--tile-ratio:819/1775"><div class="image-slot" role="img" aria-label="Smart Campus"><img src="Smart Campus Artboards/scfinal1.png" alt=""></div><div class="gallery-overlay"><strong>Smart Campus</strong><small>Smart Campus</small></div></div></a>
        <a class="gallery-item" data-gallery-pages="FollowingTheThread Artboards/FollowingTheThreadTitle.png|FollowingTheThread Artboards/FollowingTheThreadSocial.png|FollowingTheThread Artboards/FollowingTheThreadMock.png" href="image-detail.html?collection=editorial&image=02" aria-label="Open Following the Thread: Following the Thread"><div class="gallery-media" style="--tile-ratio:2/1"><div class="image-slot" role="img" aria-label="Following the Thread"><img src="FollowingTheThread Artboards/FollowingTheThreadTitle.png" alt=""></div><div class="gallery-overlay"><strong>Following the Thread</strong><small>Following the Thread</small></div></div></a>
      </div>
    </section>
  </main>
  <footer><span>© 2026 Your Name</span><a class="back-button" href="portfolio.html" aria-label="Back to home" title="Back to home"><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12c0-.55.3-1.05.8-1.34l12.6-7.5c2.18-1.3 4.77.52 4.36 3.03l-1.95 11.63c-.42 2.5-3.45 3.44-5.22 1.65L3.53 13.35A1.9 1.9 0 0 1 3 12Z"/></svg></a></footer>
</div>
<script src="gallery-lightbox.js"></script>
</body>
</html>
