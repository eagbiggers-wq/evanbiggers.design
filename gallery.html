<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
const portfolioRoute = new URL("portfolio.html", window.location.href);
portfolioRoute.searchParams.set("gallery", "general");
window.location.replace(portfolioRoute.href);
</script>
<title>Image Collection | Your Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#141414; --mute:#6b6b6b; --line:#c9c9c9; --hover-bg:#141414; --hover-ink:#ffffff;
  --gap:1px; --pad:clamp(16px,2.5vw,32px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101010;--ink:#ededed;--mute:#8f8f8f;--line:#3a3a3a;--hover-bg:#ededed;--hover-ink:#101010}
}
:root[data-theme="dark"]{--bg:#101010;--ink:#ededed;--mute:#8f8f8f;--line:#3a3a3a;--hover-bg:#ededed;--hover-ink:#101010}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
h1,h2,p,figure{margin:0}
.page{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
.grid{display:grid;gap:var(--gap);background:var(--line);border:1px solid var(--line)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cell{background:var(--bg);padding:var(--pad);min-width:0}
.span-2{grid-column:span 2}
.section{margin-top:var(--pad)}
header.grid{margin-top:var(--pad)}
header .cell{display:flex;align-items:center;padding-block:14px}
header nav{display:flex;gap:24px;justify-content:flex-end;width:100%}
header nav a:hover{text-decoration:underline;text-underline-offset:4px}
.intro{min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.intro h1{font-size:clamp(28px,5.2vw,60px);line-height:1.08;font-weight:500;max-width:16ch}
.intro p{color:var(--mute)}
.image-grid .cell{display:grid;gap:12px;align-content:start}
.image-slot{position:relative;aspect-ratio:4/3;border:1px solid var(--line);
  background:
    linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),
    linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px));
}
.image-slot span{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;background:var(--bg);padding:2px 8px;color:var(--mute);font-size:12px}
.image-grid figcaption{color:var(--mute);font-size:12px}
footer{display:flex;justify-content:space-between;gap:16px;padding:var(--pad) 0 calc(var(--pad)*1.5);color:var(--mute);font-size:12px}
@media (max-width:820px){.cols-3{grid-template-columns:repeat(2,1fr)}.span-2{grid-column:span 2}}
@media (max-width:540px){.cols-3{grid-template-columns:1fr}.span-2{grid-column:auto}header nav{gap:16px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<div class="page">
  <header class="grid cols-3">
    <div class="cell"><a href="portfolio.html"><strong>Evan Biggers</strong></a></div>
    <div class="cell span-2"><nav aria-label="Primary"><a href="portfolio.html#contact" data-contact-open aria-haspopup="dialog">Contact</a></nav></div>
  </header>

  <main>
    <section class="grid cols-3 section intro" aria-labelledby="gallery-title">
      <div class="cell span-2"><h1 id="gallery-title">Image collection</h1></div>
      <div class="cell"><p>A collection of selected images.</p></div>
    </section>

  </main>

  <footer><span>© 2026 Your Name</span><a class="back-button" href="portfolio.html" aria-label="Back to home" title="Back to home"><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12c0-.55.3-1.05.8-1.34l12.6-7.5c2.18-1.3 4.77.52 4.36 3.03l-1.95 11.63c-.42 2.5-3.45 3.44-5.22 1.65L3.53 13.35A1.9 1.9 0 0 1 3 12Z"/></svg></a></footer>
</div>
</body>
</html>
